<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dataset Editor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; background: #f5f5f5; }
        
        /* Sidebar */
        .sidebar { width: 10%; background: #fff; border-right: 1px solid #ddd; overflow-y: auto; flex-shrink: 0; }
        .sidebar-item { padding: 12px 0; text-align: center; cursor: pointer; border-bottom: 1px solid #eee; color: #666; font-size: 14px; transition: background 0.2s; }
        .sidebar-item:hover { background: #f0f0f0; }
        .sidebar-item.active { background: #e3f2fd; color: #1976d2; font-weight: 600; }
        
        /* Main content */
        .main { width: 60%; display: flex; flex-direction: column; min-width: 0; flex-shrink: 0; }
        .image-container { flex: 1; background: #fff; border: 1px solid #ddd; margin: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; transition: transform 0.1s; cursor: grab; }
        .image-container img:active { cursor: grabbing; }
        .zoom-controls { position: absolute; bottom: 10px; right: 10px; display: flex; gap: 5px; }
        .zoom-btn { width: 32px; height: 32px; border: 1px solid #ddd; background: #fff; cursor: pointer; border-radius: 4px; font-size: 18px; }
        .zoom-btn:hover { background: #f0f0f0; }
        
        /* Right panel */
        .right-panel { width: 30%; display: flex; flex-direction: column; gap: 10px; padding: 10px; flex-shrink: 0; }
        .panel { background: #2d2d2d; border-radius: 4px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-header { background: #404040; color: #fff; padding: 8px 12px; font-size: 13px; font-weight: 500; }
        .panel-content { flex: 1; overflow: auto; }
        .raw-panel { height: 45%; }
        .updated-panel { height: 55%; display: flex; flex-direction: column; }
        
        /* JSON display */
        pre { margin: 0; padding: 12px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; line-height: 1.5; color: #d4d4d4; white-space: pre-wrap; word-wrap: break-word; }
        
        /* Editor */
        textarea { width: 100%; height: 100%; border: none; resize: none; padding: 12px; font-family: 'Consolas', 'Monaco', monospace; font-size: 12px; line-height: 1.5; background: #1e1e1e; color: #d4d4d4; }
        textarea:focus { outline: none; }
        
        /* Save button */
        .save-bar { padding: 8px 12px; background: #404040; display: flex; justify-content: flex-end; gap: 8px; }
        .btn { padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-save { background: #4caf50; color: #fff; }
        .btn-save:hover { background: #43a047; }
        .btn-save:disabled { background: #666; cursor: not-allowed; }
        .btn-reset { background: #ff9800; color: #fff; }
        .btn-reset:hover { background: #f57c00; }
        
        /* Status */
        .status { font-size: 12px; color: #aaa; padding: 4px 0; }
        .status.success { color: #4caf50; }
        .status.error { color: #f44336; }
        
        /* Loading */
        .loading { display: flex; align-items: center; justify-content: center; height: 100%; color: #888; }
    </style>
</head>
<body>
    <div class="sidebar" id="sidebar"></div>
    <div class="main">
        <div class="image-container" id="imageContainer">
            <img id="image" src="" alt="Dataset Image" draggable="false">
            <div class="zoom-controls">
                <button class="zoom-btn" onclick="zoomOut()">−</button>
                <button class="zoom-btn" onclick="resetZoom()">⟲</button>
                <button class="zoom-btn" onclick="zoomIn()">+</button>
            </div>
        </div>
    </div>
    <div class="right-panel">
        <div class="panel raw-panel">
            <div class="panel-header">raw_data</div>
            <div class="panel-content"><pre id="rawData"><span class="loading">Loading...</span></pre></div>
        </div>
        <div class="panel updated-panel">
            <div class="panel-header">updated_data</div>
            <div class="panel-content" style="flex:1;display:flex;flex-direction:column;">
                <textarea id="updatedData" spellcheck="false"></textarea>
            </div>
            <div class="save-bar">
                <span class="status" id="status"></span>
                <button class="btn btn-reset" onclick="resetData()">Reset</button>
                <button class="btn btn-save" id="saveBtn" onclick="saveData()">Save</button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
